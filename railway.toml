# Railway.app Configuration
# Deploy: railway login → railway init → railway up

[build]
builder = "nixpacks"
buildCommand = "npm run build"

[build.nixpacksPlan]
providers = ["node"]

[deploy]
startCommand = "npm run start:prod"
healthcheckPath = "/api/v1"
healthcheckTimeout = 100

[[deploy.env]]
NODE_ENV = "production"

